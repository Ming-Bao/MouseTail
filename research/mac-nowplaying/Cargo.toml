[package]
name = "spike-mac-nowplaying"
version = "0.0.0"
edition.workspace = true
publish = false

[target.'cfg(target_os = "macos")'.dependencies]
anyhow.workspace = true
tokio.workspace = true
block2 = "0.6"
core-foundation = "0.10"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDictionary", "NSString", "NSValue"] }
objc2-media-player = { version = "0.3", default-features = false, features = ["std", "block2", "MPMediaItem", "MPNowPlayingInfoCenter", "MPRemoteCommand", "MPRemoteCommandCenter", "MPRemoteCommandEvent"] }
