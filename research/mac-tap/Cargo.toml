[package]
name = "spike-mac-tap"
version = "0.0.0"
edition.workspace = true
publish = false

[target.'cfg(target_os = "macos")'.dependencies]
mousetail-core = { path = "../../crates/core" }
anyhow.workspace = true
tracing.workspace = true
core-foundation = "0.10"
objc2 = "0.6"
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-core-audio-types", "objc2-foundation"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFDictionary"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSValue"] }
