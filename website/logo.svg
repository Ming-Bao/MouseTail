<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#3A4563"/>
      <stop offset="0.55" stop-color="#1D2334"/>
      <stop offset="1" stop-color="#0F121C"/>
    </linearGradient>
    <radialGradient id="moonglow" cx="0.78" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#C9D3F0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#C9D3F0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="below" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B3349"/>
      <stop offset="1" stop-color="#161B28"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECE6F7"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
    <clipPath id="above">
      <rect x="0" y="0" width="1024" height="742"/>
    </clipPath>
  </defs>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#moonglow)"/>
    <!-- a few stars: kiore come out at night -->
    <g fill="#E8ECFA">
      <circle cx="198" cy="214" r="5" opacity="0.8"/>
      <circle cx="846" cy="176" r="4" opacity="0.7"/>
      <circle cx="512" cy="152" r="3.5" opacity="0.6"/>
      <circle cx="262" cy="160" r="3" opacity="0.5"/>
      <circle cx="780" cy="262" r="3" opacity="0.5"/>
      <circle cx="878" cy="330" r="3.5" opacity="0.6"/>
      <circle cx="150" cy="330" r="3" opacity="0.5"/>
    </g>
    <!-- The other screen, below the edge the mouse peeks over -->
    <rect x="100" y="742" width="824" height="200" fill="url(#below)"/>
    <g clip-path="url(#above)">
      <!-- ears -->
      <circle cx="338" cy="410" r="150" fill="url(#fur)"/>
      <circle cx="686" cy="410" r="150" fill="url(#fur)"/>
      <circle cx="338" cy="418" r="96" fill="#F9B8CC"/>
      <circle cx="686" cy="418" r="96" fill="#F9B8CC"/>
      <!-- head -->
      <ellipse cx="512" cy="640" rx="262" ry="236" fill="url(#fur)"/>
      <!-- eyes -->
      <ellipse cx="428" cy="598" rx="36" ry="40" fill="#2A2342"/>
      <ellipse cx="596" cy="598" rx="36" ry="40" fill="#2A2342"/>
      <circle cx="440" cy="582" r="12" fill="#FFFFFF"/>
      <circle cx="608" cy="582" r="12" fill="#FFFFFF"/>
      <!-- cheeks -->
      <ellipse cx="360" cy="676" rx="44" ry="26" fill="#FFB0C6" opacity="0.75"/>
      <ellipse cx="664" cy="676" rx="44" ry="26" fill="#FFB0C6" opacity="0.75"/>
      <!-- nose and mouth -->
      <ellipse cx="512" cy="660" rx="28" ry="20" fill="#FF7FA5"/>
      <path d="M476 694 q18 22 36 0 q18 22 36 0" fill="none" stroke="#2A2342" stroke-width="10" stroke-linecap="round"/>
      <!-- whiskers -->
      <g stroke="#CFC6E6" stroke-width="7" stroke-linecap="round">
        <path d="M300 660 l-110 -18"/>
        <path d="M300 688 l-112 12"/>
        <path d="M724 660 l110 -18"/>
        <path d="M724 688 l112 12"/>
      </g>
    </g>
    <!-- the screen edge, and little paws gripping it -->
    <rect x="100" y="734" width="824" height="16" fill="#DCE2F5" opacity="0.4"/>
    <ellipse cx="412" cy="744" rx="54" ry="32" fill="url(#fur)"/>
    <ellipse cx="612" cy="744" rx="54" ry="32" fill="url(#fur)"/>
    <g stroke="#CFC6E6" stroke-width="6" stroke-linecap="round">
      <path d="M396 752 v14"/><path d="M428 752 v14"/>
      <path d="M596 752 v14"/><path d="M628 752 v14"/>
    </g>
  </g>
</svg>
